[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "critic-observer"
version = "0.1.3"
description = "Collect review evidence and measure critic contributions across agent clients."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["fastapi==0.162.0", "httpx==0.28.1", "mcp==1.30.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "playwright==1.64.1", "pyyaml==6.0.3"]

[project.scripts]
critic-observer = "critic_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
critic_observer = ["web/*", "builtin_critics.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real browser verification", "live: installed agent CLI verification"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
